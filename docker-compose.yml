services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rpm}
      POSTGRES_USER: ${POSTGRES_USER:-rpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-storage:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -filer -volume.max=0 -master.volumeSizeLimitMB=100 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rpm-local-development-only}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-development-only-change-me}
      S3_BUCKET: ${S3_BUCKET:-rpm-dev}
    ports:
      - "9000:8333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "-I", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - object_storage_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1

  backend:
    build: ./backend
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      DATABASE_URL: postgresql+psycopg://rpm:${POSTGRES_PASSWORD:-development-only-change-me}@postgres:5432/rpm
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    command: uv run --no-dev celery -A app.workers.celery_app:celery_app worker --loglevel=INFO
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  object_storage_data:
